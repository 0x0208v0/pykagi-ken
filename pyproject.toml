[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[project]
name = "pykagi-ken"
description = "Python library and CLI for Kagi.com services using session tokens"
license = "MIT"
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "0x0208v0", email = "0x0208v0@github.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp>=3.9.0",
    "parsel>=1.8.0",
]
dynamic = ["version"]


[project.urls]
Homepage = "https://github.com/0x0208v0/pykagi-ken"
Source = "https://github.com/0x0208v0/pykagi-ken"


[tool.setuptools.dynamic]
version = { attr = "pykagi_ken.__version__" }


[tool.setuptools.packages.find]
where = ["."]
include = ["pykagi_ken*"]


[tool.setuptools.package-data]
pykagi_ken = ["py.typed"]


[project.optional-dependencies]
cli = [
    "click>=8.1.0",
]
dev = [
    "setuptools>=80.9.0",
    "ruff>=0.12.8",
]

[project.scripts]
pykagi-ken-cli = "pykagi_ken.cli:main"


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
